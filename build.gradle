plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
    // ponder / catnip / flywheel
    maven { url = 'https://maven.createmod.net' }

    // registrate
    maven { url = 'https://maven.ithundxr.dev/snapshots' }

    // JEI
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = 'https://modmaven.dev/'
    }

    // KubeJS
    maven {
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }

    // KubeJS transitive dep (animated-gif-lib) — jitpack needs no content filter
    maven {
        url = 'https://jitpack.io'
    }
}

base {
    archivesName = archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Give the Gradle test source set the same Minecraft/NeoForge classpath as
    // the main sources, so ConfigTest compiles (run it via the configTest task).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    // Create 6.0.10 (1.21.1 NeoForge) — bundles flywheel/ponder/catnip/registrate via jarJar
    implementation files("libs/create-1.21.1-6.0.10.jar")

    // Create: More Machines 2.7
    implementation files("libs/createmoremachines-1.21.1-2.7.jar")

    // Ponder API (referenced by CMM class hierarchy)
    compileOnly "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"

    // Registrate (bundled in create jar at runtime; needed at compile time for CMM API types)
    compileOnly "com.tterrag.registrate:Registrate:MC1.21-1.3.0+67"

    // Flywheel API (PartialModel used by tiered JEI animations)
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:1.0.6"

    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // KubeJS integration (optional at runtime — mixins are gated on presence)
    implementation("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") {
        exclude group: 'com.github.rtyley', module: 'animated-gif-lib-for-java'
    }
    interfaceInjectionData "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"

    // KubeJS-Create (provides recipe schemas for create:pressing, create:mixing etc.)
    implementation fileTree(dir: 'libs', include: ['kubejs-create-neoforge-*.jar'])

    // Create: Hand Made is optional. Put its jar in libs/ only when developing with it.
    def createHandMadeJars = fileTree(dir: 'libs', include: ['create_hand_made-*.jar'])
    compileOnly createHandMadeJars
    runtimeOnly createHandMadeJars

    // Mekanical-Create is optional. Put its jar in libs/ when compiling/testing the integration.
    def mekanicalCreateJars = fileTree(dir: 'libs', include: ['mekanicalcreate-*.jar'])
    compileOnly mekanicalCreateJars
    runtimeOnly mekanicalCreateJars

    // Mekanism APIs are only referenced by the optional Mekanical-Create mixins.
    def mekanismJars = fileTree(dir: 'libs', include: ['mekanism-*.jar'])
    compileOnly mekanismJars
    runtimeOnly mekanismJars
}

// ConfigTest is a main()-style regression suite rather than a JUnit test,
// so run it explicitly against the Minecraft-aware test runtime classpath.
tasks.register('configTest', JavaExec) {
    group = 'verification'
    description = 'Runs the Config regression suite.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.minecart.more_formula.ConfigTest'
    // Keep log files emitted by the test runtime inside build/.
    workingDir = layout.buildDirectory.get().asFile
}

tasks.named('check') {
    dependsOn tasks.named('configTest')
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             create_hand_made_version: create_hand_made_version,
                             mekanicalcreate_version : mekanicalcreate_version]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = 'CreateMoreMachinesFormula'
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
